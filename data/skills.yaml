    name: AWS（サーバーレス構成）
    category: cloud
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - life-repo と gcp-cert-master の 2 サービスを ap-northeast-1 に自力で構築し稼働させている
      - 使用実績のあるサービスは Lambda・API Gateway HTTP API・Cognito・DynamoDB・S3 + CloudFront(OAC)・SQS FIFO + DLQ・SSM Parameter Store・SNS・CloudWatch Alarms・Budgets・Amplify Hosting
