    level: 2
    target: 4
    experience_years: 1.5
    last_used: 2026-09
    notes: ダッシュボード追加はできる。SLO 設計とトレース導入は未経験。

  - id: infra-linux
    name: Linux 運用
    category: infra
    level: 3
    target: 4
    experience_years: 5
    last_used: 2026-10
    evidence:
      - 本番サーバのリソース枯渇障害を一次切り分けから恒久対応まで担当

  # ---- cloud ----
  - id: cloud-aws
