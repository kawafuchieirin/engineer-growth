  # ---- practice ----
  - id: prac-automation
    name: 自動化の設計
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - Issue フォームからラベルを付ける仕組みで、排他グループを定義して古いラベルを外す処理を実装
      - 本文編集時に状態ラベルが巻き戻らないよう onlyOnOpen で制御している
      - inbox.md への追記 → Issue 化 → カテゴリラベル付与で Markdown に追記して自動クローズ、という流れを組んだ
      - 重複は duplicate として追加せずに閉じる冪等設計、失敗時はラベルを戻してコメントしてから exit 1
      - GITHUB_TOKEN による push が他のワークフローを再発火しないことを理由コメント付きで利用し、無限ループを防いでいる
      - Issue 本文を ${{ }} でシェルに埋め込まず、スクリプトがイベント JSON から読む設計にしている
    notes: 自分のための自動化が中心。チームの運用に自動化を入れた実績は不明＝要確認。

  - id: prac-security
    name: セキュリティ実践
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - OIDC + 用途別ロールで長期クレデンシャルを廃し、権限を ARN 単位まで絞っている
      - gitleaks と detect-private-key を pre-commit に組み込んでいる
      - Basic 認証の資格情報を SOPS(age) で暗号化して管理した
      - 書き込み専用属性でシークレットを state に載せない、ログに本文を出さない配慮を入れている
      - Cognito を MFA 必須 + PKCE で構成し、CloudFront に CSP・HSTS・frame DENY を設定
      - ワークフローでシェルインジェクションを避ける書き方を選んでいる
    notes: tfsec / checkov / govulncheck などの自動スキャンは未導入。サードパーティ action の SHA ピンも未徹底で、サプライチェーン対策は途上。

