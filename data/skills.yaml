  - id: be-database
    name: データストア設計
    category: backend
    level: 2
    target: 3
    last_used: 2026-10
    evidence:
      - DynamoDB の単一テーブル設計（pk/sk・PITR・SSE・削除保護）で、Scan を避けるための索引を設計している
      - SQLite で CHECK 制約と部分ユニークインデックスを使い、「計測中タイマーは全体で 1 つ」という不変条件を DB 側で保証した
      - BeginTx と defer Rollback のパターンでトランザクションを扱っている
      - CloudFormation で RDS を構築した（2023。スクールの課題として手本に沿って作ったもの）
    notes: |
      初版で「RDBMS の経験なし」と書いたのは不正確だった。2023 年に CloudFormation で
      RDS を構築した痕跡がある。ただし作ったのはプロビジョニングのみで、スキーマ設計・
      チューニング・マイグレーション運用・N+1 の改善といった経験は無いため level は 2 に留める。
      業務でも RDBMS は日常的に扱っていないことを聞き取りで確認した。

