# スキル棚卸し（単一の信頼できる情報源）
#
# ■ このファイルの level / evidence は、2026-10-12 時点で公開リポジトリに
#   残っている痕跡だけを根拠に付けた。根拠は evidence に具体的なファイルや
#   実装内容として書いてあるので、納得できない行は自分で上書きすること。
# ■ レベルを何の測定値で決めたかは assessment/2026-10-12/ に残した。
#   - SKILL_BASIS.md … スキルごとの根拠と、上げるために欠けているもの
#   - raw/*.tsv       … 測定値そのもの
#   - measure.sh      … 同じ数字を再現するスクリプト
# ■ 判定の前提と限界は docs/ASSESSMENT.md にまとめた。特に重要な前提は 2 つ。
#   - 業務での経験は GitHub から見えないため、一切反映していない。
#   - コミットの多くが AI 協働（Co-Authored-By）なので、自力で書いた度合いは
#     本人しか判定できない。レベルは「設計を説明でき、動くものを出せた」水準で付けた。
# ■ 2026-10-12 に本人への聞き取りを実施し、初版の「要確認」8 件を解消した。
#   聞き取りで確定した前提（いずれも本人申告。GitHub からは見えない）:
#     - エンジニアとしての実務経験は 5〜10 年（GitHub の最古が 2023-03 なのは
#       公開リポジトリを使い始めた時期で、実務の開始時期ではない）
#     - AWS / クラウドを業務で扱っているのは 1〜3 年
#     - AWS 認定 12 冠を取得済み・有効期限内
#     - 業務で日常的に扱うのは Linux・コンテナ（Docker/ECS）・監視ツール
#     - 本番障害の一次対応を担当している（ポストモーテムの文化はない）
#     - 他者のコードを日常的にレビューしている（育成・技術選定の主導は担当外）
#     - 社外登壇・技術記事・OSS 貢献はない
# ■ level の意味は data/levels.yaml を参照（0-5）。
# ■ 記入方針・棚卸し手順は docs/SKILLS_GUIDE.md を参照。

owner:
  name: かわふち
  role: インフラエンジニア
  updated: 2026-10-12

categories:
