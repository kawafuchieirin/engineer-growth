    target: 4
    experience_years: 2
    last_used: 2026-09
    evidence:
      - 本番環境の IaC をモジュール分割して単独で設計・運用
    links:
      - label: Terraform スタイル規約
        url: https://developer.hashicorp.com/terraform/language/style

  - id: infra-cicd
    name: CI/CD パイプライン
    category: infra
    level: 4
    target: 5
    experience_years: 3
    last_used: 2026-10
