    notes: |
      業務でのクラウド経験は 1〜3 年（本人申告）。AWS 認定 12 冠は取得済み・有効期限内（本人申告）。
      個人リポジトリの構成はマネージドのサーバーレスに限られるが、業務では
      コンテナ（ECS）と監視を日常的に扱っている（infra-docker / infra-observability を参照）。
      大規模運用（QPS 規模が語れる水準）とマルチアカウント運用は未経験。

  - id: cloud-iam
    name: IAM / 権限設計
    category: cloud
    level: 3
    target: 4
    last_used: 2026-09
    evidence:
      - GitHub Actions から OIDC で AssumeRole する構成を自作し、長期アクセスキーを一切発行していない
      - 用途別にロールを分離している（plan は読み取り専用・apply・notes-export・release）
      - 信頼ポリシーの sub を StringEquals の完全一致にし、plan は pull_request と main、apply は environment と main に限定
      - apply 用ポリシー 293 行を「サービス別アクション × name_prefix-* の ARN」の交差だけに絞り、resources の全許可には理由コメントを付けている
      - immutable subject claims（数値 ID 入りの sub）への切り替えにも対応済み
    notes: 対象は単一アカウント。マルチアカウント（Organizations / SCP / Control Tower）の経験はない。

  - id: cloud-serverless-design
    name: イベント駆動 / 非同期設計
    category: cloud
    level: 3
    target: 4
    last_used: 2026-09
    evidence:
      - life-repo で「API → SQS FIFO → writer Lambda → GitHub コミット」の非同期書き込みを設計
      - MessageDeduplicationId で冪等化し、ReportBatchItemFailures で部分失敗に対応
      - DLQ を maxReceiveCount=5 で設定し、visibility_timeout を関数タイムアウトの 6 倍に取る理由までコメントしている
      - DLQ 非空と最古メッセージ 30 分超の 2 つで検知する設計にしている
    notes: 失敗時の再投入（リドライブ）運用と、実トラフィックでの検証はしていない。

