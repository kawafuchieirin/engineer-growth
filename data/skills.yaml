  # ---- practice ----
  - id: prac-automation
    name: 自動化の設計
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - Issue フォームからラベルを付ける仕組みで、排他グループを定義して古いラベルを外す処理を実装
      - 本文編集時に状態ラベルが巻き戻らないよう onlyOnOpen で制御している
      - inbox.md への追記 → Issue 化 → カテゴリラベル付与で Markdown に追記して自動クローズ、という流れを組んだ
      - 重複は duplicate として追加せずに閉じる冪等設計、失敗時はラベルを戻してコメントしてから exit 1
      - GITHUB_TOKEN による push が他のワークフローを再発火しないことを理由コメント付きで利用し、無限ループを防いでいる
      - Issue 本文を ${{ }} でシェルに埋め込まず、スクリプトがイベント JSON から読む設計にしている
    notes: 自分のための自動化が中心。チームの運用に自動化を入れた実績はない（聞き取りで確認）。

  - id: prac-security
    name: セキュリティ実践
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - OIDC + 用途別ロールで長期クレデンシャルを廃し、権限を ARN 単位まで絞っている
      - gitleaks と detect-private-key を pre-commit に組み込んでいる
      - Basic 認証の資格情報を SOPS(age) で暗号化して管理した
      - 書き込み専用属性でシークレットを state に載せない、ログに本文を出さない配慮を入れている
      - Cognito を MFA 必須 + PKCE で構成し、CloudFront に CSP・HSTS・frame DENY を設定
      - ワークフローでシェルインジェクションを避ける書き方を選んでいる
    notes: |
      このリポジトリは action の SHA 固定を完了し、依存の既知脆弱性も 0 件にした（2026-10-17）。
      ただし tfsec / checkov / govulncheck などの自動スキャンは未導入で、
      「人が気をつける対策」から「機械が止める対策」には至っていない。
      他リポジトリへの横展開も未了。

  - id: prac-testing
    name: テスト設計
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - Go 222 ケース・vitest 126 ケース・node:test 78 ケース・pytest を、いずれも自分で設計して書いている
      - fake API やインメモリの fake repository を用意して外部依存を切っている
      - 「今日」を引数や s.now() で注入し、日付依存のテストを決定的にしている
      - OpenAPI の定義と実装の 405 Allow ヘッダが一致するかをテストで照合している
    notes: E2E（Playwright 等）・カバレッジ閾値・ベンチマーク・Fuzz・並列実行は未使用。

  - id: prac-git
    name: Git / PR 運用
    category: practice
    level: 3
    target: 3
    last_used: 2026-10
    evidence:
      - 日本語の Conventional Commits で、1 コミット 1 論点を保っている
      - PR 単位の squash マージと、release-please / Release Drafter / 自作の semver 判定を使い分けている
      - コミット規約を .claude/rules に文書化して運用に乗せた
      - main への直接コミットを避け、ブランチと PR を通している
    notes: |
      初期のリポジトリには規約外のメッセージが混在しており、規約化してから日が浅い。
      業務では他者のコードを日常的にレビューしている（本人申告）。

  - id: prac-troubleshooting
    name: 原因究明
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - 自動リリースで patch が検出されない問題を、git log の区切り文字が 2 件目以降に改行を残すことまで特定して修正した
      - 仮説と結果を表に整理し、「他のケースが通ったのは最新コミットが偶然判定対象だったから」と成功理由まで掘り下げている
      - 再発防止を「リスト末尾・中間・先頭で試す」という一般形に落としている
      - push 前にワークフローの run を yaml.safe_load で取り出し、gh をスタブに差し替えてローカル検証する手順を作った
      - 未検証の範囲を明示して残している
    notes: 記録に残した振り返りは 1 件のみ。母数が少ないので、この水準が再現するかはこれから。

  - id: prac-ai-collaboration
    name: AI 協働開発
    category: practice
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - CLAUDE.md に方針を集約し、詳細を .claude/rules に分離する構成を自分で設計している
      - Claude Code と Codex CLI で skill を symlink 共用し、同じ指示を 2 つのツールで使い回している
      - /retro で振り返りを定型化し、保存先と一覧の更新まで自動化した
      - 2026-09 以降、AI 協働を前提に 6 リポジトリを立ち上げて運用に乗せている
      - 設計判断の理由をコードコメントに残す運用を徹底しており、後から読んで追える状態になっている
    notes: 公開リポジトリのコミットの大半が AI 協働（gcp-cert-master 22/25、life-repo 14/18）。自力実装との切り分けは本人にしか判定できない。

  - id: prac-performance
    name: 性能計測 / 負荷試験
    category: practice
    level: 1
    target: 3
    last_used: 2026-05
    evidence:
      - k6 を CI に組み込み、しきい値（失敗率 1% 未満・p95 500ms 未満・チェック成功率 99% 超）で判定する仕組みを作った
      - 結果をレポートとしてリポジトリに記録している（総リクエスト 66・p95 10.52ms・失敗 0%）
    notes: 規模が 2VU・20 秒でスモーク相当。限界を探る負荷試験・プロファイリング・ボトルネック特定の経験はない。

