  # ---- languages ----
  - id: lang-go
    name: Go
    category: languages
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - task-manager を 6 モジュール・約 1 万行で設計し、API と画面を別プロセスに分離した
      - errors.Is / errors.As を 75 箇所、%w ラップを 78 箇所で使い、sentinel error と独自エラー型を使い分けている
      - 層をまたぐときに sql.ErrNoRows をドメインのエラーへ変換している
      - ORM を使わず database/sql を直接扱い、go:embed で自作マイグレータを実装
      - SQLite の挙動を理解した DSN 設計（WAL・busy_timeout・_txlock=immediate に理由コメント）
      - signal.NotifyContext と select による graceful shutdown（10 秒タイムアウト、ErrServerClosed を正常扱い）
      - テスト 222 ケースをテーブル駆動で書き、-race で実行している
      - golangci-lint で errorlint・gosec・noctx・sqlclosecheck・bodyclose を有効化
    notes: 並行処理の設計経験は浅い（goroutine は shutdown の 1 箇所のみ、errgroup・worker pool なし）。ベンチマーク・プロファイリング・カバレッジ計測は未使用。

