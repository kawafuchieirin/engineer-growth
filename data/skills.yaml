  # ---- infra ----
  - id: infra-terraform
    name: Terraform
    category: infra
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - 2 リポジトリで本番相当の構成をモジュール分割して管理（data / hosting / auth / api / cicd / budget など）
      - モジュール間の循環依存を一方向に解く方針をコメントで残している
      - for_each・dynamic statement・count による任意モジュール化・locals からの for 式導出を使い分けている
      - moved ブロックでリソースを再作成せずにルート構成を移行した
      - variables.tf に validation（regex / alltrue）を書き、不正な入力を plan 前に落としている
      - tfstate 用 S3 を別 state の bootstrap で作成（prevent_destroy・バージョニング・SSE・public access block・90 日失効）
      - backend を空にして -backend-config で渡し、アカウント ID をコードに埋めていない
      - 書き込み専用属性（value_wo）でトークンを state に載せない
      - required_version / provider のバージョンを固定し .terraform.lock.hcl をコミットしている
    notes: 複数環境（dev/stg/prod）の分離、terraform test、tflint や tfsec の CI 実行は未経験。

