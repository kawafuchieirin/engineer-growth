  # レーダーチャートの軸順と重み付き平均に使う。合計を 1 に揃える必要はない。
  - id: cloud
    name: クラウド
    weight: 1.5
  - id: infra
    name: インフラ / IaC / CI-CD
    weight: 1.5
  - id: languages
    name: プログラミング言語
    weight: 1.2
  - id: practice
    name: エンジニアリング実践
    weight: 1.2
  - id: backend
    name: バックエンド
    weight: 1.0
  - id: soft
    name: 発信 / 育成
    weight: 1.0
  - id: frontend
    name: フロントエンド
    weight: 0.5

