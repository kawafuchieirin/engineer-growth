      - apply は workflow_dispatch のみ、かつ main 以外の ref を拒否する形に絞っている
      - permissions をジョブ単位で最小化し、concurrency で競合する実行を直列化している
      - Conventional Commits から semver を判定して Release を自動作成するワークフローを自作
      - mise-action で .mise.toml を唯一の情報源にし、ローカルと CI のバージョンを一致させている
      - dependabot で npm / github-actions / terraform を週次更新（グルーピング設定あり）
    notes: サードパーティ action の SHA ピンは未徹底（gcp-cert-master は 19 箇所すべてタグ参照）。マトリクスビルド・再利用ワークフロー・クロスコンパイルは未経験。環境保護ルールによる承認ゲートは未設定。

