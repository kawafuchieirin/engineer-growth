  # ---- infra ----
  - id: infra-terraform
    name: Terraform
    category: infra
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - 2 リポジトリで本番相当の構成をモジュール分割して管理（data / hosting / auth / api / cicd / budget など）
      - モジュール間の循環依存を一方向に解く方針をコメントで残している
      - for_each・dynamic statement・count による任意モジュール化・locals からの for 式導出を使い分けている
      - moved ブロックでリソースを再作成せずにルート構成を移行した
      - variables.tf に validation（regex / alltrue）を書き、不正な入力を plan 前に落としている
      - tfstate 用 S3 を別 state の bootstrap で作成（prevent_destroy・バージョニング・SSE・public access block・90 日失効）
      - backend を空にして -backend-config で渡し、アカウント ID をコードに埋めていない
      - 書き込み専用属性（value_wo）でトークンを state に載せない
      - required_version / provider のバージョンを固定し .terraform.lock.hcl をコミットしている
    notes: 複数環境（dev/stg/prod）の分離、terraform test、tflint や tfsec の CI 実行は未経験。

  - id: infra-cicd
    name: GitHub Actions / CI-CD
    category: infra
    level: 3
    target: 4
    last_used: 2026-10
    evidence:
      - terraform plan の結果を PR コメントに投稿する仕組みを自作（マーカーで既存コメントを更新・60000 字で切り詰め・失敗時もコメントを残してから exit 1）
      - apply は workflow_dispatch のみ、かつ main 以外の ref を拒否する形に絞っている
      - permissions をジョブ単位で最小化し、concurrency で競合する実行を直列化している
      - Conventional Commits から semver を判定して Release を自動作成するワークフローを自作
      - mise-action で .mise.toml を唯一の情報源にし、ローカルと CI のバージョンを一致させている
      - dependabot で npm / github-actions / terraform を週次更新（グルーピング設定あり）
    notes: |
      このリポジトリは action 17 箇所すべてを SHA で固定済み（GitHub 製も含む、2026-10-17）。
      ただし gcp-cert-master は 19 箇所すべてタグ参照のままで、横展開はできていない。
      マトリクスビルド・再利用ワークフロー・クロスコンパイルは未経験。
      環境保護ルールによる承認ゲートは未設定。

