# ロードマップの単一の信頼できる情報源。
#
# ■ 2026-10-17 の聞き取りで決まった方向に基づく。前提は data/goals.yaml の冒頭を参照。
#
# ■ 設計の中心にある考え方: **時間の出どころで軸を分ける。**
#
#     work  軸 … 業務の中で達成する。学習時間（週 5 時間未満）を消費しない。
#                 機会を取るかどうかの問題であって、勉強量の問題ではない。
#     study 軸 … 週 5 時間未満の学習枠を使う。**一度に 1 つしか進められない。**
#
#   この分離をしないと「GCP 14 資格 + 社内に仕組み + 設計主導 + 発信」を
#   週 5 時間に詰め込む計画になり、必ず破綻する。
#
# ■ 週 5 時間未満 = 四半期で約 60 時間。study 軸のマイルストーンは
#   1 四半期に 1 つまで。それ以上置かない。
#
# ■ 意図的に入れていないもの:
#     - Kubernetes … 求人の必須要件は 12 件中 2 件（assessment/VIEW_MARKET.md）。
#       週 5 時間未満では費用対効果が悪い。「任せられる人」にも必須ではない。
#     - GCP の 2 本目以降 … 1 本目を通してから、実際にかかった時間を見て決める。
#       計画段階で 14 本並べるのは、過去に同じことをして取得 0 件だったやり方。
#     - 大規模運用（1 万 QPS 等） … 今の環境では原理的に積めない。
#       行き先を「今の環境で任せられる人」に決めたため、追わない。
#
# 書き方の指針は docs/ROADMAP_GUIDE.md を参照。

