# ロードマップの単一の信頼できる情報源。
#
# ■ ここに書いてあるのは data/skills.yaml で見えた空白と、本人が文書に残した
#   計画から引いた下書き。「やると決めた」ものではないので、要らないものは消すこと。
# ■ steps の done は、終わったものだけ true にする。進捗はこの比率で出る。
#
# 書き方の指針は docs/ROADMAP_GUIDE.md を参照。
#   - tracks     … 並行して伸ばす軸。3〜4 本に絞る（増やすと「全部やる」計画になる）。
#   - milestones … 1〜3ヶ月で終わる塊。outcome に「何ができたら終わりか」を書く。
#   - depends_on … 先に終わっていないと着手しても無駄になるものだけを書く。

updated: 2026-10-12

tracks:
  - id: foundation
    name: 土台（棚卸しと記録）
  - id: cloud
    name: クラウド / インフラの空白
  - id: output
    name: 発信
  - id: hardening
    name: 自分の環境の堅牢化

milestones:
  - id: m-skills-baseline
    title: スキル棚卸しの基準値を確定する
    track: foundation
    status: in_progress
    start: 2026-10-12
    due: 2026-10-31
    skills: [soft-writing]
    goals: [g-2026q4-skills-truth]
    outcome: |
      data/skills.yaml に「要確認」が 1 件も残っておらず、業務での経験も反映されている。
      snapshot が 1 件以上記録され、次回実行で差分が出る状態になっている。
    steps:
      - description: 公開リポジトリの痕跡から初版を作る
        done: true
      - description: 業務経験（Linux・ネットワーク・チームでのレビュー）を反映する
        done: false
      - description: AWS 認定の取得状況を確定し、根拠として書く
        done: false
      - description: snapshot を実行して基準値を記録する
        done: false

  - id: m-first-post
    title: 最初の技術記事を公開する
    track: output
    status: planned
    start: 2026-10-20
    due: 2026-11-30
    skills: [soft-writing, prac-troubleshooting]
    goals: [g-2026q4-output]
    outcome: |
      記事が 1 本公開され、ネタ出しから公開までの流れが自分の中で一度回っている。
      題材は作ったものではなく「詰まって解いた過程」で、再現手順まで書かれている。
    steps:
      - description: 題材を選ぶ（自動リリースの区切り文字の件が最有力）
        done: false
      - description: 下書きを blog/drafts に書く
        done: false
      - description: 公開して PROFILE.md に反映されることを確認する
        done: false
    depends_on: [m-skills-baseline]

  - id: m-sha-pin
    title: Actions のサプライチェーン対策を全リポジトリに広げる
    track: hardening
    status: planned
    start: 2026-11-01
    due: 2026-11-30
    skills: [prac-security, infra-cicd]
    outcome: |
      書き込み権限を持つワークフローのサードパーティ action が、すべてコミット SHA で
      固定されている。dependabot が SHA の更新を PR で提案する状態になっている。
    steps:
      - description: 書き込み権限を持つワークフローを全リポジトリから洗い出す
        done: false
      - description: サードパーティ action を SHA に固定する
        done: false
      - description: dependabot の github-actions エコシステムを有効にする
        done: false

  - id: m-container-prod
    title: コンテナを「教材」から「動かしているもの」にする
    track: cloud
    status: planned
    start: 2026-12-01
    due: 2027-01-31
    skills: [infra-docker, cloud-aws]
    outcome: |
      自分のサービスのいずれかがコンテナとしてクラウド上で動いており、
      イメージのビルドとデプロイが CI から自動で行われている。
      マルチステージビルドと非 root 実行ができている。
    steps:
      - description: 対象を決める（task-manager の API が候補）
        done: false
      - description: マルチステージ・非 root の Dockerfile に書き直す
        done: false
      - description: レジストリへの push とデプロイを CI に組む
        done: false

  - id: m-network-hands-on
    title: ネットワークを知識から構築経験に変える
    track: cloud
    status: planned
    start: 2027-02-01
    due: 2027-03-31
    skills: [infra-network, infra-terraform]
    outcome: |
      VPC・サブネット・ルーティング・セキュリティグループを Terraform で構築し、
      そこにプライベート接続のリソースを置いた構成が自分の手元に残っている。
      ANS の学習ノートの内容を、動くコードとして説明できる。
    steps:
      - description: VPC とサブネットを Terraform で構築する
        done: false
      - description: プライベートサブネットのリソースへ到達する経路を作る
        done: false
      - description: 構成図と設計判断の理由を残す
        done: false
    depends_on: [m-container-prod]
