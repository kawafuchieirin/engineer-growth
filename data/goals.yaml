# 目標（OKR）の単一の信頼できる情報源。
#
# ■ 2026-10-17 の聞き取りで、本人が方向を決めた。この 4 つが前提になっている。
#     1. 2〜3 年後の行き先 … 今の環境で「任せられる人」になる
#     2. クラウドの軸     … GCP に広げる
#     3. 強みの扱い       … 「仕組みを作って渡す」を職務にする（社内に入れる）
#     4. 使える時間       … 学習と発信に週 5 時間未満
#
# ■ 最大の制約は 4 の「週 5 時間未満」。四半期で約 60 時間しかない。
#   GCP 認定 14 資格の計画は「週 10 時間・18 ヶ月」前提で書かれているため、
#   週 5 時間未満では 36 ヶ月かかる。全冠を当面の目標に置かないのは意図的。
#
# ■ 設計を分ける考え方（ここが重要）:
#     「任せられる人になる」は学習時間ではなく**業務の中**で達成される。
#     設計を起こす・技術選定を主導する・後進を育てる・社内に仕組みを入れる、は
#     いずれも週 5 時間の学習枠を消費しない。機会を取るかどうかの問題。
#     逆に GCP と発信は学習枠を使う。だから学習枠は 1 度に 1 つに絞る。
#
# 書き方の指針は docs/GOALS_GUIDE.md を参照。

horizon:
  vision: |
    今の環境で「任せられる人」になる。設計を自分で起こして通し、技術選定の理由を
    説明して合意を取り、後から入った人が自分で判断できる状態まで持っていく。
    そのやり方として、自分が繰り返し作ってきた「行動を仕組みに変える装置」を
    自分の外に出す。自分の道具で終わらせず、チームが使う仕組みにする。
    クラウドは AWS を土台にしつつ Google Cloud にも手を伸ばし、
    ベンダーに依存せず基盤を設計できる状態を目指す。
  updated: 2026-10-17

goals:
  - id: g-2026q4-postmortem
    objective: 障害から学んだことが、自分の頭の外に残る状態にする
    quarter: 2026-Q4
    status: not_started
    why: |
      本番障害の一次対応は担当しているが、ポストモーテムの文化がなく、
      何を変えたかが残っていない。SRE の信頼性階層で言うと、監視と
      インシデント対応は埋まっているのに、その上の 1 段だけが空いている。
      ここは 3 つが同時に埋まる場所でもある。階層の空白、転職市場で最も弱い
      「何を変えたか」、そしてやりたいことの 2 番目である発信の題材。
      /retro の仕組みは自分で作ってあるので、道具は揃っている。
    skills: [infra-incident-response, prac-troubleshooting, soft-writing]
    key_results:
      - id: kr-postmortem-written
        description: 自分が対応した障害をポストモーテムとして書く
        metric: 書いたポストモーテムの件数
        target: 2
        current: 0
        unit: 件
      - id: kr-postmortem-shared
        description: 書いたものをチームに共有し、再発防止の変更を 1 つ通す
        metric: 通した変更の件数
        target: 1
        current: 0
        unit: 件

  - id: g-2026q4-first-output
    objective: 自分がやったことを、リポジトリの外から読める形にする
    quarter: 2026-Q4
    status: not_started
    why: |
      やりたいことの 2 番目に「ブログの執筆」を挙げているのに記事は 0 本。
      書く力は Markdown 15,237 行（Go より多い）で証明済みで、足りないのは
      出す先だけ。業務の 5〜10 年が公開記録に一切残っていないという問題とも
      同じ根を持つ。1 本出して流れを一度通すことが目的で、本数は追わない。
    skills: [soft-writing, prac-troubleshooting]
    key_results:
      - id: kr-article
        description: 技術記事を公開する
        metric: 公開した記事数
        target: 1
        current: 0
        unit: 本

  - id: g-2027q1-gcp-first
    objective: Google Cloud を「計画がある」から「受かった」に進める
    quarter: 2027-Q1
    status: not_started
    why: |
      14 資格・18 ヶ月の計画と合格ゲートの定義、進捗を判定するアプリまで
      作ってあるが、取得は 0 件。仕組みを作る段階で満足してしまう傾向が
      ここに出ている。週 5 時間未満では全冠に 36 ヶ月かかるため、
      当面は 1 本に絞る。1 本通せば、計画が実在することが証明できる。
    skills: [cloud-gcp]
    key_results:
      - id: kr-gcp-mock
        description: 初見の模試で 80% 以上を 2 回連続で取る
        metric: 基準を満たした回数
        target: 2
        current: 0
        unit: 回
      - id: kr-gcp-pass
        description: Associate Cloud Engineer に合格する
        metric: 合格した資格数
        target: 1
        current: 0
        unit: 資格

  - id: g-2027q2-platform
    objective: 自分の作る仕組みを、チームが使うものにする
    quarter: 2027-Q2
    status: not_started
    why: |
      「自分の行動を仕組みに変える装置」を 5 回、技術スタックを変えて
      独立に実装している。これは再現性のある能力だが、対象はすべて自分だった。
      チームの運用に自動化を入れた実績はまだ無い（prac-automation の notes）。
      「任せられる人」の条件は他者への影響なので、ここを越えないと level 4 には届かない。
      既にある型の転用なので、学習時間はほとんど要らない。
    skills: [prac-automation, infra-cicd, soft-mentoring]
    key_results:
      - id: kr-team-mechanism
        description: チームが日常的に使う仕組みを 1 つ入れて定着させる
        metric: 定着した仕組みの数
        target: 1
        current: 0
        unit: 件
      - id: kr-design-lead
        description: 自分が起こした設計をレビューに通し、合意を取る
        metric: 通した設計の件数
        target: 1
        current: 0
        unit: 件
