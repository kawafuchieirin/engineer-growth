# 目標（OKR）の単一の信頼できる情報源。
#
# ■ ここに書いてあるのは「本人のリポジトリに文書として残っている意思」だけを
#   根拠にした下書き。勝手な想像で足した目標は入れていない。
#   - GCP 認定        … gcp-cert-master/README.md に 18 ヶ月・週 10 時間の計画がある
#   - 技術記事の公開  … このリポジトリを作った動機として本人が挙げた「ブログの執筆」
#   - 棚卸しの精度    … data/skills.yaml に残した「要確認」を消す作業
# ■ 本当にやりたいことが別にあるなら、遠慮なく丸ごと書き換えること。
#   目標は人から渡されるものではなく、自分で決めるもの。
#
# 書き方の指針は docs/GOALS_GUIDE.md を参照。
#   - objective … 定性的な「どうなりたいか」。数字を入れない。
#   - key_results … 測定可能な成果。metric / target / current で進捗が計算される。
#   - why … なぜやるのかの判断軸。四半期途中の取捨選択はこれを根拠に行うので必須。

horizon:
  vision: |
    AWS のサーバーレスで培った「コードから環境を再現できる」強みを、ネットワークと
    コンテナまで広げて、クラウドを選ばず基盤を設計・運用できる状態にする。
    あわせて、作ったものと詰まった過程を外に出し、勉強会の中だけで終わらせない。
  updated: 2026-10-12

goals:
  - id: g-2026q4-skills-truth
    objective: この棚卸しを、自分が見て納得できる状態にする
    quarter: 2026-Q4
    status: in_progress
    why: |
      初版は公開リポジトリの痕跡だけで付けた値で、業務経験が一切入っていない。
      土台が実態とずれていると、この先の「伸びた」がすべて意味を失う。
      数字を良くする作業ではなく、基準点を正しくする作業として先に片付ける。
    skills: [soft-writing, prac-git]
    key_results:
      - id: kr-unverified
        description: notes に「要確認」と書いたスキルを、実態に合わせて確定させる
        metric: 確定させたスキル数
        target: 8
        current: 8
        unit: 件
      - id: kr-baseline
        description: 確定後の値を snapshot で記録し、成長の起点を作る
        metric: data/history.yaml の記録件数
        target: 1
        current: 0
        unit: 件

  - id: g-2026q4-output
    objective: 自分がやったことを、リポジトリの外から読める形にする
    quarter: 2026-Q4
    status: not_started
    why: |
      設計判断の理由をコメントに残す習慣はもうあるのに、外に出した記事は 0 本。
      勉強会は参加者の分しか届かないが、記事は時間を越えて届く。
      書くと理解の穴が見つかるので、発信は他者貢献である前に自分の検証手段になる。
    skills: [soft-writing, prac-troubleshooting]
    key_results:
      - id: kr-posts
        description: 技術記事を公開する
        metric: 公開した記事数
        target: 3
        current: 0
        unit: 本
      - id: kr-retro-to-post
        description: 振り返りの記録を記事に書き直す（原因究明の過程をそのまま出す）
        metric: 振り返りを元にした記事数
        target: 1
        current: 0
        unit: 本

  - id: g-2027q1-gcp-first
    objective: Google Cloud を「計画がある」から「受かった」に進める
    quarter: 2027-Q1
    status: not_started
    why: |
      14 資格・18 ヶ月の計画と合格ゲートの定義まで作ったが、取得表はまだ空のまま。
      仕組みを作る段階で止まっているので、1 本合格させて計画が実在することを証明する。
      AWS 側で手が動く状態を作れているので、同じことをもう一つのクラウドでやる。
    skills: [cloud-gcp]
    key_results:
      - id: kr-mock
        description: 初見の模試で 80% 以上を 2 回連続で取る
        metric: 基準を満たした回数
        target: 2
        current: 0
        unit: 回
      - id: kr-gate
        description: 自分で定義した合格ゲート 6 項目を満たす
        metric: 充足した項目数
        target: 6
        current: 0
        unit: 項目
      - id: kr-pass
        description: 認定試験に合格する
        metric: 合格した資格数
        target: 1
        current: 0
        unit: 資格
