# GitHub Pages への公開
#
# pnpm build が出力する dist/ をそのまま Pages アーティファクトとして公開する。
# dist/ は Git 管理外（.gitignore）なので、公開のたびに CI 上で生成する。
name: Pages

on:
  push:
    branches: [main]
    # サイトの内容に影響するパスだけに限定する。
    # docs/ や README.md の変更で再デプロイしても出力は変わらないため。
    paths:
      - "data/**"
      - "blog/**"
      - "src/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  # OIDC で Pages にデプロイするために必要（トークンのハードコードは不要）
  pages: write
  id-token: write

# デプロイは途中で止めると公開状態が中途半端になりうるので中断しない。
# 連続 push 時は順番に実行される。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: サイトをビルドしてアーティファクト化
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push しないジョブなので、資格情報を .git/config に残さない
          # （後続のサードパーティ action から読めてしまうため）
          persist-credentials: false

      - name: mise で Node をセットアップ（.mise.toml の宣言に従う）
        # action は可変タグではなくコミット SHA で固定する。GitHub 製（actions/*）も
        # 例外にしない。タグは作者が付け替えられるため、v5 のまま中身が差し替わると
        # 書き込み権限を持つこのワークフローがそのコードを実行してしまう。
        # SHA の更新は dependabot（github-actions エコシステム）が PR で提案する。
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: pnpm をセットアップし、ストアをキャッシュ
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: 依存関係をインストール（ロックファイル固定）
        run: pnpm install --frozen-lockfile

      - name: データ検証（壊れたデータを公開しない）
        run: pnpm validate

      - name: 静的サイトをビルド（dist/ を生成）
        run: pnpm build

      - name: Pages の設定を読み込む（base URL の解決）
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: dist/ を Pages アーティファクトとしてアップロード
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: GitHub Pages へデプロイ
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Pages の保護ルールと公開 URL の表示に必要
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: アーティファクトを公開
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
