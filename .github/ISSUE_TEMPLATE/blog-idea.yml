name: ブログ記事のネタ
description: blog/posts/ に書く記事のアイデアを登録する
title: "blog: <記事テーマ>"
labels: ["blog"]
body:
  - type: markdown
    attributes:
      value: |
        front matter の書き方は `docs/BLOG_GUIDE.md` を参照してください。
        書き始めるときは `pnpm new:post` で雛形を作れます。
  - type: input
    id: theme
    attributes:
      label: テーマ
      description: 記事のタイトル案（あとで変えてよい）
      placeholder: Terraform の state 分割で運用が楽になった話
    validations:
      required: true
  - type: textarea
    id: takeaway
    attributes:
      label: 伝えたい学び
      description: 読者が持ち帰る一番大事な 1-3 行。これが書けないならまだ書く時期ではない
      placeholder: |
        環境ごとに state を分けると、適用範囲が明確になり事故が減る。
        分割のコストは命名規約を先に決めれば回収できる。
    validations:
      required: true
  - type: input
    id: skill-ids
    attributes:
      label: 関連スキル ID
      description: data/skills.yaml の ID をカンマ区切りで（記事の front matter の skills に入れる）
      placeholder: infra-terraform, infra-cicd
    validations:
      required: false
  - type: input
    id: target-date
    attributes:
      label: 公開目標日
      description: YYYY-MM-DD 形式
      placeholder: "2026-12-20"
    validations:
      required: false
  - type: textarea
    id: outline
    attributes:
      label: 構成メモ
      description: 見出し案や書きたい材料（任意）
      placeholder: |
        - 背景: モノリシックな state で詰まった点
        - やったこと
        - 結果と残課題
    validations:
      required: false
